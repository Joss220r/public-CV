name: Despliegue Continuo Homelab

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Descargar cambios del repositorio
        uses: actions/checkout@v4

      - name: Reconstruir y levantar contenedores
        run: |
          docker compose down --remove-orphans
          docker compose up -d --build
